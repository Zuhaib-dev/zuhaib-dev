<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Zuhaib Rashid — full-stack developer</title>
  <desc id="desc">A dark, editorial banner with a subtle grid and a bright blue accent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#A5B4FC" stroke-opacity=".055"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 230 -400 0 1030 35)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity=".24"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <path d="M64 67h48" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="64" y="151" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Zuhaib Rashid</text>
  <text x="66" y="198" fill="#A5B4FC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="500" letter-spacing="3">FULL-STACK DEVELOPER</text>
  <text x="66" y="252" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">Building thoughtful web products, from interface to infrastructure.</text>
  <g transform="translate(920 105)">
    <circle cx="84" cy="76" r="78" stroke="#7DD3FC" stroke-opacity=".13"/>
    <circle cx="84" cy="76" r="56" stroke="#7DD3FC" stroke-opacity=".2"/>
    <circle cx="84" cy="76" r="34" fill="#172B46" stroke="#7DD3FC" stroke-opacity=".5"/>
    <path d="m76 61-14 15 14 15M92 61l14 15-14 15M88 54l-8 44" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="84" cy="76" r="3" fill="#F8FAFC"/>
    <circle cx="5" cy="76" r="3" fill="#7DD3FC"/>
    <circle cx="163" cy="76" r="3" fill="#818CF8"/>
  </g>
  <text x="66" y="320" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" letter-spacing="1.5">KASHMIR, INDIA</text>
  <path d="M64 338h1072" stroke="#94A3B8" stroke-opacity=".14"/>
</svg>
